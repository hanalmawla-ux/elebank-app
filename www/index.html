html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Arial,sans-serif}
#app{max-width:480px;margin:0 auto;padding:18px 18px 120px}
h1,h2,h3,p{margin:0}svg.i{flex:none;vertical-align:middle}
.p1{fill:var(--acc)}.p2{fill:color-mix(in srgb,var(--acc) 72%,#000)}.p3{fill:color-mix(in srgb,var(--acc) 38%,#fff)}.y{fill:#ffd166}.b{fill:#8fd3e8}.w{fill:#fff}.d{fill:#3b2430}
.card{background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:20px;margin-bottom:18px;box-shadow:var(--sh)}
.hero{background:var(--hero);position:relative;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.lg{width:54px;height:54px;border-radius:17px;background:var(--card2);color:var(--at);display:grid;place-items:center;flex:none}
.hd .t{flex:1}.hd h1{font-size:30px;line-height:1.1}.mut{color:var(--mut)}.sm{font-size:14px}
.pill{border:1px solid var(--btn-bd);background:var(--btn-bg);color:var(--at);border-radius:16px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;border:0;border-radius:999px;min-height:54px;padding:0 18px;background:var(--acc);color:var(--on);font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.btn.g{background:var(--btn-bg);color:var(--btn-tx);border:1px solid var(--btn-bd);border-radius:18px;min-height:56px}
.btn.k{background:var(--btn-bg);color:var(--btn-tx);border:1px solid var(--btn-bd);border-radius:18px}
.tag{display:flex;gap:6px;align-items:center;font-size:12px;letter-spacing:.08em;color:var(--at);font-weight:700;margin-bottom:12px}
.big{font-size:32px;font-weight:800;line-height:1.15;max-width:55%}
.pig{position:absolute;width:140px;top:22px;inset-inline-end:14px;overflow:visible;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--acc) 45%,transparent))}
.pig .p1{fill:url(#gl);stroke:rgba(255,255,255,.6);stroke-width:1.2}
.pig .p2{fill:color-mix(in srgb,var(--acc) 50%,transparent);stroke:rgba(255,255,255,.4);stroke-width:1}
.pig .p3{fill:rgba(255,255,255,.35);stroke:rgba(255,255,255,.65);stroke-width:1}
.pig{animation:walk 1.1s ease-in-out infinite;transform-origin:50% 100%}
.pig .ear{animation:ear 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:85% 8%}
.pig .tail{animation:tail .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 0}
.pig .coin{animation:coin 1.1s ease-in-out infinite}

@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes coin{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-22px) rotate(-6deg) scale(.96,1.06)}80%{transform:translateY(0) rotate(4deg) scale(1.06,.94)}100%{transform:translateY(0)}}
.pig.happy,.cheer .pig{animation:jump .7s ease-out 3}
.pig.happy .ear,.pig.happy .tail,.cheer .ear,.cheer .tail{animation-duration:.25s}
.cheer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;background:color-mix(in srgb,var(--bg) 78%,transparent);animation:fadeo 2.1s forwards}
.cheer .pig{position:static;width:190px}
.cheer .amt{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:36px;font-weight:800;color:var(--at);animation:rise 2s ease-out forwards}
.cheer .cf{position:absolute;left:50%;top:50%;font-size:26px;animation:fly 1.6s ease-out forwards}
@keyframes fadeo{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
@keyframes rise{from{transform:translateY(20px)}to{transform:translateY(-14px)}}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.2) rotate(var(--r));opacity:0}}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cnt{background:var(--card2);color:var(--at);border-radius:14px;padding:3px 12px;font-size:15px;margin-inline-start:10px;font-weight:700}
.thumb{height:200px;margin:-20px -20px 16px;border-radius:28px 28px 0 0;background:var(--card2);display:grid;place-items:center;position:relative;overflow:hidden}

function home(){
 return head('EleBank.',t('tl'))+`<div class="card hero" style="padding:24px"><p class="tag">${ico('heart',14)} ${t('tag')}</p>${PIG}<h2 class="big">${t('h1')}</h2><p class="mut" style="margin:34px 0 20px;font-size:18px">${t('sub')}</p><button class="btn" onclick="go('add')">${ico('plus',20)} ${t('add')}</button></div>
 <p class="mut sm" style="text-align:center;margin:-4px 0 26px">${ico('shield',16)} ${t('dev')}</p>
 <h3 class="ch">${t('list')}<span class="cnt">${S.goals.length}</span></h3>`+
 S.goals.map(g=>{const p=pct(g.saved,g.target),d=g.saved>=g.target;return `<div class="card"><div class="thumb">${g.img?`<img src="${g.img}" alt="">`:ill(g.icon,130)}<span class="badge">${d?ico('cc',15)+' '+t('done'):ico('sp',15)+' '+t('saving')}</span></div><h3 style="font-size:24px">${esc(g.name)}</h3><p class="mut" style="margin:2px 0 14px">${t('tgt')} · ${money(g.target,g.cur)}</p><div class="row"><div><p class="mut">${t('sv')}</p><p class="num">${money(g.saved,g.cur)}</p></div>${ring(p,84)}</div><div class="row" style="margin-top:18px"><button class="btn g" style="flex:1" onclick="askAdd(${g.id})">${ico('plus',20)} ${t('am')}</button><button class="pill" style="background:none;border:0;color:var(--mut)" onclick="askDel(${g.id})">${ico('trash',20)} ${t('del')}</button></div></div>`}).join('')+totals()+`<p class="mut sm" style="text-align:center">EleBank · ${t('tl')}</p>`;

function add(){

function ins(){
 const by={};S.goals.forEach(g=>{(by[g.cur]=by[g.cur]||{s:0,t:0});by[g.cur].s+=g.saved;by[g.cur].t+=g.target});
 const deps=S.goals.flatMap(g=>g.dep.map(d=>({n:g.name,c:g.cur,a:d.a,d:d.d}))).sort((a,b)=>b.d-a.d).slice(0,8);
 return head(t('ins'),t('tl'))+`<div class="card hero" style="padding:26px"><h2 style="font-size:32px;line-height:1.2;max-width:62%">${t('look')}</h2>${PIG.replace('class="pig"','class="pig" style="width:130px;top:30px"')}<p class="mut" style="margin:12px 0 16px;font-size:18px;max-width:62%">${t('steps')}</p><p style="color:var(--at);font-weight:700">${ico('flag',20)} ${S.goals.filter(g=>g.saved<g.target).length} · ${t('prog')}</p></div>`+totals()+

 `<h3 class="ch" style="margin-top:26px">${t('rec')}</h3>`+(deps.map(d=>`<div class="dep"><div class="sq">${ico('plus',26)}</div><div><b style="font-size:20px">${esc(d.n)}</b><p class="mut">${dt(d.d)}</p></div><span class="a">${money(d.a,d.c)}</span></div>`).join('')||`<p class="mut">${t('none')}</p>`);

function set(){

 <div class="card row"><div class="row" style="justify-content:flex-start"><div class="sq">${ico('moon',26)}</div><div><b style="font-size:19px">${t('dark')}</b><p class="mut">${t('darkS')}</p></div></div><button class="sw ${isDark()?'on':''}" onclick="toggleDark()" aria-label="${t('dark')}"><i>${ico('moon',16)}</i></button></div>
 <div class="card"><div class="row" style="justify-content:flex-start"><div class="sq">${ico('pal',26)}</div><div><b style="font-size:19px">${t('theme')}</b><p class="mut">${t('themeS')}</p></div></div><div class="dots">${ks.map(c=>`<button class="dot ${c===S.color?'on':''}" style="background:${CH[c]}" onclick="setColor('${c}')" aria-label="${c}">${c===S.color?ico('ck',20):''}</button>`).join('')}</div><div style="text-align:center"><span class="pill"><span style="width:9px;height:9px;border-radius:50%;background:var(--acc)"></span> ${t('cl')[ci]} ${ico('cc',16)}</span></div></div>
 <div class="card"><b style="font-size:19px"><span style="color:var(--ok)">${ico('shieldc',24)}</span> ${t('pT')}</b><p class="mut" style="margin-top:12px;font-size:18px">${t('pB')}</p></div>
 <div class="card"><b style="font-size:19px"><span style="color:var(--at)">${ico('heart',24)}</span> ${t('sT')}</b><p class="mut" style="margin-top:12px;font-size:18px">${t('sB')}</p></div><p class="mut sm" style="text-align:center">EleBank · 1.0</p>`;
}

function syncAppIcon(){try{const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;const P=(C.Plugins&&C.Plugins.AppIcon)||(C.registerPlugin&&C.registerPlugin('AppIcon'));if(!P||localStorage.getItem('elebank_icon')===S.color)return;localStorage.setItem('elebank_icon',S.color);P.set({color:S.color}).catch(()=>localStorage.removeItem('elebank_icon'))}catch(e){}}

function onFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);fm.img=c.toDataURL('image/jpeg',.8);pv.innerHTML=`<img src="${fm.img}" alt="">`};im.src=r.result};r.readAsDataURL(f)}
function create(){
 const n=nm.value.trim(),a=parseFloat(am.value);
 if(!n||!(a>0)){er.textContent=t('err');return}
 S.goals.push({id:Date.now(),name:n,target:a,cur:fm.cur,icon:fm.icon,img:fm.mode==='upload'?fm.img:null,saved:0,dep:[]});
 fm={icon:0,img:null,mode:'emoji',cur:'USD'};save();go('home');
}
function modal(body,okL,fn){m.innerHTML=`<div class="ov"><div class="card">${body}<div class="row" style="margin-top:18px"><button class="btn g" onclick="m.innerHTML=''">${t('cn')}</button><button class="btn" id="ok">${okL}</button></div></div></div>`;document.getElementById('ok').onclick=()=>{fn();m.innerHTML=''};}
function cheer(txt){const o=document.createElement('div');o.className='cheer';const em=['❤️','🪙','✨','💖','⭐'];let h=`<span class="amt">${txt}</span>${PIG.replace('class="pig"','class="pig happy"')}`;for(let i=0;i<14;i++){const a=i/14*6.283,r=120+Math.random()*90;h+=`<span class="cf" style="--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-40}px;--r:${(Math.random()*80-40)|0}deg">${em[i%5]}</span>`}o.innerHTML=h;document.body.appendChild(o);setTimeout(()=>o.remove(),2100)}
function askAdd(id){const g=S.goals.find(x=>x.id===id);modal(`<b style="font-size:20px">${esc(g.name)}</b><p class="mut" style="margin:6px 0 12px">${t('q')}</p><input id="mi" inputmode="decimal" placeholder="0.00">`,t('am'),()=>{const a=parseFloat(mi.value);if(a>0){g.saved+=a;g.dep.unshift({a,d:Date.now()});save();render();cheer('+ '+money(a,g.cur))}})}
function askDel(id){const g=S.goals.find(x=>x.id===id);modal(`<b style="font-size:20px">${esc(g.name)}</b><p class="mut" style="margin-top:6px">${t('dq')}</p>`,t('del'),()=>{S.goals=S.goals.filter(x=>x.id!==id);save();render()})}

const sp=document.createElement('div');sp.id='splash';sp.innerHTML=`${PIG}<h1>EleBank</h1><p>${t('tl')}</p>`;document.body.appendChild(sp);
sp.onclick=()=>sp.remove();setTimeout(()=>sp.classList.add('out'),2000);setTimeout(()=>sp.remove(),2700);
